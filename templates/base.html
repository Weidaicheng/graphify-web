<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Graphify Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Sidebar -->
    <aside class="w-56 bg-slate-900 border-r border-slate-800 flex flex-col min-h-screen fixed left-0 top-0 bottom-0 z-30">
        <div class="p-5 border-b border-slate-800">
            <h1 class="text-lg font-bold text-white tracking-tight">
                <span class="text-emerald-400">⬡</span> Graphify
            </h1>
            <p class="text-xs text-slate-500 mt-0.5">知识图谱管理</p>
        </div>
        <nav class="flex-1 p-3 space-y-1">
            {% set path = request.url.path %}
            <a href="/" class="nav-item {% if path == '/' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                仪表盘
            </a>
            <a href="/repos" class="nav-item {% if path == '/repos' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                仓库
            </a>
            <a href="/graphs" class="nav-item {% if path.startswith('/graphs') %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                图谱
            </a>
        </nav>
        <div class="p-3 border-t border-slate-800 text-xs text-slate-600">
            v0.1.0 · local
        </div>
    </aside>

    <!-- Main content -->
    <main class="ml-56 min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            c.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
        }

        async function apiFetch(url, options = {}) {
            try {
                const resp = await fetch(url, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options,
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
                return data;
            } catch (e) {
                showToast(e.message, 'error');
                throw e;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
