<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Graphify Web{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Top bar -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center px-5 shrink-0 fixed top-0 left-0 right-0 z-30">
        <a href="/" class="flex items-center gap-2 text-white font-bold tracking-tight">
            <span class="text-emerald-400 text-lg">⬡</span>
            <span>Graphify</span>
        </a>
        {% block breadcrumb %}{% endblock %}
    </header>

    <!-- Main content -->
    <main class="mt-12 min-h-[calc(100vh-3rem)]">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-14 right-4 z-50 space-y-2"></div>

    <script>
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            c.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
        }

        async function apiFetch(url, options = {}) {
            try {
                const resp = await fetch(url, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options,
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
                return data;
            } catch (e) {
                showToast(e.message, 'error');
                throw e;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
